<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>67 FM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Impact, Arial Black, Arial, sans-serif;
      background: #000;
      color: #ff0000;
      overflow: hidden;
    }

    body {
      background:
        repeating-linear-gradient(
          0deg,
          #020000 0px,
          #020000 3px,
          #120000 4px,
          #120000 6px
        ),
        radial-gradient(circle at center, #280000 0%, #050000 55%, #000 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 0, 0, 0.08) 50%,
          transparent 100%
        );
      animation: scan 2.5s linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.03) 0px,
          rgba(255, 0, 0, 0.03) 1px,
          transparent 1px,
          transparent 4px
        );
      pointer-events: none;
      z-index: 2;
    }

    @keyframes scan {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(100%);
      }
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 5;
    }

    .hidden {
      display: none !important;
    }

    .gate-box,
    .player-box {
      width: 100%;
      max-width: 760px;
      background:
        linear-gradient(180deg, rgba(20, 0, 0, 0.98), rgba(0, 0, 0, 0.98));
      border: 5px solid #ff0000;
      box-shadow:
        0 0 8px #ff0000,
        0 0 22px #ff0000,
        0 0 60px rgba(255, 0, 0, 0.65),
        inset 0 0 35px rgba(255, 0, 0, 0.22);
      padding: 26px;
      position: relative;
    }

    .gate-box::before,
    .player-box::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 2px dashed rgba(255, 0, 0, 0.55);
      pointer-events: none;
    }

    .logo,
    .big-title {
      text-align: center;
      font-size: clamp(58px, 12vw, 120px);
      font-weight: 900;
      letter-spacing: 8px;
      color: #ff0000;
      text-shadow:
        0 0 4px #ff0000,
        0 0 12px #ff0000,
        0 0 28px #ff0000,
        6px 6px 0 #3a0000;
      animation: titleFlicker 0.8s infinite alternate;
      line-height: 1;
      margin-bottom: 20px;
    }

    @keyframes titleFlicker {
      0% {
        opacity: 0.82;
        filter: blur(0px);
        transform: scale(1);
      }
      30% {
        opacity: 1;
        filter: blur(1px);
        transform: scale(1.015);
      }
      60% {
        opacity: 0.9;
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1.025);
      }
    }

    .subline {
      text-align: center;
      font-size: 15px;
      color: #ff4b4b;
      letter-spacing: 4px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .gate-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .gate-input {
      width: 100%;
      padding: 18px;
      background: #070000;
      border: 4px solid #ff0000;
      color: #ff0000;
      font-size: 30px;
      font-weight: 900;
      text-align: center;
      outline: none;
      box-shadow:
        inset 0 0 20px rgba(255, 0, 0, 0.3),
        0 0 12px rgba(255, 0, 0, 0.5);
    }

    .gate-input::placeholder {
      color: #6f0000;
    }

    .gate-btn,
    .main-btn {
      border: 4px solid #ff0000;
      background:
        linear-gradient(180deg, #ff0000 0%, #b00000 45%, #520000 100%);
      color: #fff;
      font-size: 32px;
      font-weight: 900;
      padding: 18px;
      cursor: pointer;
      text-transform: uppercase;
      text-shadow:
        2px 2px 0 #000,
        0 0 8px #fff;
      box-shadow:
        0 0 15px rgba(255, 0, 0, 0.9),
        inset 0 0 20px rgba(255, 255, 255, 0.12);
    }

    .gate-btn:hover,
    .main-btn:hover {
      transform: scale(1.02) rotate(-1deg);
      filter: brightness(1.25);
    }

    .gate-btn:active,
    .main-btn:active {
      transform: scale(0.97);
    }

    .error {
      min-height: 28px;
      color: #ff6666;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #ff0000;
    }

    .player-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .canvas-wrap {
      width: 100%;
      padding: 10px;
      background: #030000;
      border: 4px solid #ff0000;
      box-shadow:
        inset 0 0 30px rgba(255, 0, 0, 0.2),
        0 0 20px rgba(255, 0, 0, 0.65);
      position: relative;
      overflow: hidden;
    }

    .canvas-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 0, 0, 0.08) 0px,
          rgba(255, 0, 0, 0.08) 6px,
          transparent 6px,
          transparent 18px
        );
      pointer-events: none;
      z-index: 2;
    }

    canvas {
      display: block;
      width: 100%;
      height: 235px;
      background: #050000;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .main-btn {
      width: 100%;
      max-width: 330px;
      font-size: 40px;
      letter-spacing: 3px;
    }

    .vol-wrap {
      width: 100%;
      max-width: 540px;
      text-align: center;
    }

    .vol-label {
      font-size: 22px;
      color: #ff5555;
      letter-spacing: 8px;
      font-weight: 900;
      margin-bottom: 12px;
      text-shadow:
        0 0 6px #ff0000,
        2px 2px 0 #000;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: #140000;
      border: 3px solid #ff0000;
      outline: none;
      cursor: pointer;
      box-shadow:
        0 0 10px rgba(255, 0, 0, 0.8),
        inset 0 0 12px rgba(255, 0, 0, 0.35);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      background: #ff0000;
      border: 3px solid #fff;
      box-shadow:
        0 0 12px #ff0000,
        0 0 24px #ff0000;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 32px;
      height: 32px;
      background: #ff0000;
      border: 3px solid #fff;
      box-shadow:
        0 0 12px #ff0000,
        0 0 24px #ff0000;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .gate-box,
      .player-box {
        padding: 18px;
      }

      canvas {
        height: 170px;
      }

      .main-btn {
        font-size: 30px;
      }

      .gate-input {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="screen" id="gateScreen">
    <div class="gate-box">
      <div class="logo">67 FM</div>
      <div class="subline">пароль</div>

      <div class="gate-form">
        <input
          type="password"
          id="passwordInput"
          class="gate-input"
          placeholder="ВВОДИ"
          autocomplete="off"
        />
        <button id="enterBtn" class="gate-btn">ВХОД</button>
        <div class="error" id="errorBox"></div>
      </div>
    </div>
  </div>

  <div class="screen hidden" id="playerScreen">
    <div class="player-box">
      <div class="big-title">67 FM</div>

      <div class="canvas-wrap">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="controls">
        <button id="playBtn" class="main-btn">PLAY</button>

        <div class="vol-wrap">
          <div class="vol-label">ГРОМКОСТЬ</div>
          <input
            type="range"
            id="volumeSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.67"
          />
        </div>
      </div>
    </div>
  </div>

  <audio id="radio" crossorigin="anonymous" preload="none">
    <source
      src="https://radio.67fm.ru/listen/radio67/radio.mp3"
      type="audio/mpeg"
    />
  </audio>

  <script>
    const allowedPasswords = ["67", "228", "radio67"];

    const gateScreen = document.getElementById("gateScreen");
    const playerScreen = document.getElementById("playerScreen");
    const passwordInput = document.getElementById("passwordInput");
    const enterBtn = document.getElementById("enterBtn");
    const errorBox = document.getElementById("errorBox");

    const radio = document.getElementById("radio");
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    radio.volume = 0.67;

    let audioContext = null;
    let analyser = null;
    let source = null;
    let dataArray = null;
    let visualizerStarted = false;
    let realVisualizer = false;

    function enterSite() {
      const value = passwordInput.value.trim();

      if (allowedPasswords.includes(value)) {
        errorBox.textContent = "";
        gateScreen.classList.add("hidden");
        playerScreen.classList.remove("hidden");
        resizeCanvas();
        draw();
      } else {
        errorBox.textContent = "НЕ ТО";
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    enterBtn.addEventListener("click", enterSite);

    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        enterSite();
      }
    });

    volumeSlider.addEventListener("input", function () {
      radio.volume = Number(volumeSlider.value);
    });

    async function setupAudio() {
      if (visualizerStarted) return;

      visualizerStarted = true;

      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();

        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.74;

        source = audioContext.createMediaElementSource(radio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        realVisualizer = true;
      } catch (error) {
        console.warn("Visualizer fallback:", error);
        realVisualizer = false;
      }
    }

    async function togglePlay() {
      try {
        await setupAudio();

        if (audioContext && audioContext.state === "suspended") {
          await audioContext.resume();
        }

        if (radio.paused) {
          await radio.play();
          playBtn.textContent = "PAUSE";
        } else {
          radio.pause();
          playBtn.textContent = "PLAY";
        }
      } catch (error) {
        console.error(error);
        alert("ПОТОК НЕ ЗАПУСТИЛСЯ");
      }
    }

    playBtn.addEventListener("click", togglePlay);

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);

    function draw() {
      requestAnimationFrame(draw);

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);

      drawBackground(width, height);

      if (realVisualizer && analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        drawKolhozBars(width, height, dataArray);
      } else {
        drawFakeKolhozBars(width, height);
      }

      drawCenterLine(width, height);
      drawRandomTrash(width, height);
    }

    function drawBackground(width, height) {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, "#170000");
      gradient.addColorStop(0.5, "#050000");
      gradient.addColorStop(1, "#180000");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      for (let y = 0; y < height; y += 14) {
        ctx.fillStyle = y % 28 === 0
          ? "rgba(255, 0, 0, 0.08)"
          : "rgba(255, 0, 0, 0.025)";
        ctx.fillRect(0, y, width, 5);
      }
    }

    function drawKolhozBars(width, height, data) {
      const barCount = Math.min(96, data.length);
      const barGap = 2;
      const barWidth = Math.max(3, width / barCount - barGap);
      let x = 0;

      for (let i = 0; i < barCount; i++) {
        const raw = data[i];
        const chaos = Math.sin(Date.now() / 80 + i * 0.7) * 18;
        const value = Math.max(0, Math.min(255, raw + chaos));

        const barHeight = Math.max(4, (value / 255) * (height - 12));
        const hot = Math.floor(150 + (value / 255) * 105);

        ctx.shadowBlur = 16;
        ctx.shadowColor = "rgba(255, 0, 0, 0.95)";

        ctx.fillStyle = `rgb(${hot}, 0, 0)`;
        ctx.fillRect(x, height - barHeight, barWidth, barHeight);

        ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
        ctx.fillRect(x, height - barHeight, barWidth, 3);

        if (value > 170) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, height - barHeight - 6, barWidth, 4);
        }

        ctx.shadowBlur = 0;

        x += barWidth + barGap;
      }
    }

    function drawFakeKolhozBars(width, height) {
      const bars = 72;
      const barGap = 2;
      const barWidth = width / bars - barGap;
      let x = 0;

      for (let i = 0; i < bars; i++) {
        const t = Date.now() / 90;
        const wave1 = Math.sin(t + i * 0.35);
        const wave2 = Math.sin(t * 0.55 + i * 0.9);
        const random = Math.sin(t * 1.7 + i * 2.1);

        const mix = (wave1 + wave2 + random + 3) / 6;
        const barHeight = 12 + mix * (height - 20);

        ctx.shadowBlur = 14;
        ctx.shadowColor = "rgba(255, 0, 0, 0.9)";
        ctx.fillStyle = "rgb(230, 0, 0)";
        ctx.fillRect(x, height - barHeight, barWidth, barHeight);

        ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
        ctx.fillRect(x, height - barHeight, barWidth, 3);
        ctx.shadowBlur = 0;

        x += barWidth + barGap;
      }
    }

    function drawCenterLine(width, height) {
      const y = height / 2 + Math.sin(Date.now() / 160) * 20;

      ctx.beginPath();
      ctx.moveTo(0, y);

      for (let x = 0; x < width; x += 12) {
        const yy = y + Math.sin(Date.now() / 80 + x * 0.05) * 12;
        ctx.lineTo(x, yy);
      }

      ctx.strokeStyle = "rgba(255, 0, 0, 0.8)";
      ctx.lineWidth = 2;
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#ff0000";
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawRandomTrash(width, height) {
      const now = Date.now();

      for (let i = 0; i < 12; i++) {
        const x = Math.abs(Math.sin(now / (200 + i * 17) + i)) * width;
        const y = Math.abs(Math.cos(now / (180 + i * 23) + i)) * height;
        const size = 2 + Math.abs(Math.sin(now / 100 + i)) * 6;

        ctx.fillStyle = i % 3 === 0
          ? "rgba(255,255,255,0.35)"
          : "rgba(255,0,0,0.55)";

        ctx.fillRect(x, y, size, size);
      }
    }

    resizeCanvas();
  </script>
</body>
</html>
