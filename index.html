<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>67 FM</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #ff0000;
      font-family: Impact, Arial Black, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      background:
        repeating-linear-gradient(
          0deg,
          #020000 0px,
          #020000 4px,
          #120000 5px,
          #120000 8px
        ),
        radial-gradient(circle at center, #260000 0%, #050000 55%, #000 100%);
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .hidden {
      display: none !important;
    }

    .gate-box,
    .player-box {
      width: 100%;
      max-width: 700px;
      background: linear-gradient(180deg, rgba(18, 0, 0, 0.98), rgba(0, 0, 0, 0.98));
      border: 4px solid #ff0000;
      box-shadow:
        0 0 12px #ff0000,
        0 0 35px rgba(255, 0, 0, 0.55),
        inset 0 0 25px rgba(255, 0, 0, 0.18);
      padding: 24px;
      text-align: center;
    }

    .site-logo {
      display: block;
      width: min(62vw, 260px);
      height: auto;
      margin: 0 auto 18px;
      filter: drop-shadow(0 0 18px #ff0000);
    }

    .big-title {
      font-size: clamp(44px, 10vw, 86px);
      font-weight: 900;
      letter-spacing: 6px;
      color: #ff0000;
      text-shadow:
        0 0 6px #ff0000,
        0 0 16px #ff0000,
        5px 5px 0 #3a0000;
      margin-bottom: 18px;
      line-height: 1;
    }

    .subline {
      font-size: 16px;
      color: #ff4d4d;
      letter-spacing: 5px;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .gate-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .gate-input {
      width: 100%;
      padding: 18px;
      background: #050000;
      border: 3px solid #ff0000;
      color: #ff0000;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      outline: none;
      box-shadow: inset 0 0 14px rgba(255, 0, 0, 0.3);
    }

    .gate-input::placeholder {
      color: #650000;
    }

    .gate-btn,
    .main-btn {
      border: 3px solid #ff0000;
      background: linear-gradient(180deg, #ff0000 0%, #a40000 55%, #420000 100%);
      color: #fff;
      font-size: 30px;
      font-weight: 900;
      padding: 16px;
      cursor: pointer;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #000;
      box-shadow: 0 0 14px rgba(255, 0, 0, 0.8);
    }

    .gate-btn:active,
    .main-btn:active {
      transform: scale(0.97);
    }

    .error {
      min-height: 26px;
      color: #ff7777;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .player-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .canvas-wrap {
      width: 100%;
      padding: 8px;
      background: #030000;
      border: 3px solid #ff0000;
      box-shadow:
        inset 0 0 18px rgba(255, 0, 0, 0.18),
        0 0 16px rgba(255, 0, 0, 0.5);
    }

    canvas {
      display: block;
      width: 100%;
      height: 190px;
      background: #050000;
    }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .main-btn {
      width: 100%;
      max-width: 320px;
      font-size: 38px;
      letter-spacing: 3px;
    }

    .vol-wrap {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .vol-label {
      font-size: 21px;
      color: #ff5555;
      letter-spacing: 7px;
      font-weight: 900;
      margin-bottom: 12px;
      text-shadow: 0 0 6px #ff0000;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 16px;
      background: #140000;
      border: 2px solid #ff0000;
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 0 8px rgba(255, 0, 0, 0.35);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 30px;
      height: 30px;
      background: #ff0000;
      border: 2px solid #fff;
      box-shadow: 0 0 12px #ff0000;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 30px;
      height: 30px;
      background: #ff0000;
      border: 2px solid #fff;
      box-shadow: 0 0 12px #ff0000;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .gate-box,
      .player-box {
        padding: 18px;
      }

      .site-logo {
        width: min(58vw, 210px);
        margin-bottom: 12px;
      }

      .big-title {
        font-size: clamp(40px, 12vw, 70px);
      }

      canvas {
        height: 130px;
      }

      .main-btn {
        font-size: 30px;
      }

      .gate-input {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="screen" id="gateScreen">
    <div class="gate-box">
      <img src="logo.png" alt="67 FM" class="site-logo" />
      <div class="subline">пароль</div>

      <div class="gate-form">
        <input
          type="password"
          id="passwordInput"
          class="gate-input"
          placeholder="ВВОДИ"
          autocomplete="off"
        />
        <button id="enterBtn" class="gate-btn">ВХОД</button>
        <div class="error" id="errorBox"></div>
      </div>
    </div>
  </div>

  <div class="screen hidden" id="playerScreen">
    <div class="player-box">
      <img src="logo.png" alt="67 FM" class="site-logo" />

      <div class="canvas-wrap">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="controls">
        <button id="playBtn" class="main-btn">PLAY</button>

        <div class="vol-wrap">
          <div class="vol-label">ГРОМКОСТЬ</div>
          <input
            type="range"
            id="volumeSlider"
            min="0"
            max="1"
            step="0.01"
            value="0.67"
          />
        </div>
      </div>
    </div>
  </div>

  <audio id="radio" crossorigin="anonymous" preload="none">
    <source
      src="https://radio.67fm.ru/listen/radio67/radio.mp3"
      type="audio/mpeg"
    />
  </audio>

  <script>
    const allowedPasswords = ["67", "228", "radio67"];

    const gateScreen = document.getElementById("gateScreen");
    const playerScreen = document.getElementById("playerScreen");
    const passwordInput = document.getElementById("passwordInput");
    const enterBtn = document.getElementById("enterBtn");
    const errorBox = document.getElementById("errorBox");

    const radio = document.getElementById("radio");
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    radio.volume = 0.67;

    let audioContext = null;
    let analyser = null;
    let source = null;
    let dataArray = null;
    let visualizerReady = false;
    let isPlaying = false;

    let lastFrame = 0;
    const FPS = 18;
    const FRAME_INTERVAL = 1000 / FPS;

    function enterSite() {
      const value = passwordInput.value.trim();

      if (allowedPasswords.includes(value)) {
        errorBox.textContent = "";
        gateScreen.classList.add("hidden");
        playerScreen.classList.remove("hidden");
        resizeCanvas();
        drawIdleBars();
      } else {
        errorBox.textContent = "НЕ ТО";
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    enterBtn.addEventListener("click", enterSite);

    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        enterSite();
      }
    });

    volumeSlider.addEventListener("input", function () {
      radio.volume = Number(volumeSlider.value);
    });

    async function setupAudio() {
      if (visualizerReady) return;

      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();

        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.82;

        source = audioContext.createMediaElementSource(radio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        visualizerReady = true;
      } catch (error) {
        console.warn("Visualizer disabled:", error);
        visualizerReady = false;
      }
    }

    async function togglePlay() {
      try {
        await setupAudio();

        if (audioContext && audioContext.state === "suspended") {
          await audioContext.resume();
        }

        if (radio.paused) {
          await radio.play();
          isPlaying = true;
          playBtn.textContent = "PAUSE";
          requestAnimationFrame(draw);
        } else {
          radio.pause();
          isPlaying = false;
          playBtn.textContent = "PLAY";
          drawIdleBars();
        }
      } catch (error) {
        console.error(error);
        alert("ПОТОК НЕ ЗАПУСТИЛСЯ");
      }
    }

    playBtn.addEventListener("click", togglePlay);

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener("resize", function () {
      resizeCanvas();
      if (!isPlaying) drawIdleBars();
    });

    function clearCanvas(width, height) {
      ctx.fillStyle = "#050000";
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "rgba(255, 0, 0, 0.06)";
      for (let y = 0; y < height; y += 18) {
        ctx.fillRect(0, y, width, 5);
      }
    }

    function drawIdleBars() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      clearCanvas(width, height);

      const bars = window.innerWidth < 700 ? 18 : 28;
      const gap = 3;
      const barWidth = width / bars - gap;

      for (let i = 0; i < bars; i++) {
        const h = 10 + Math.abs(Math.sin(i * 0.8)) * height * 0.35;
        const x = i * (barWidth + gap);

        ctx.fillStyle = "#7a0000";
        ctx.fillRect(x, height - h, barWidth, h);
      }
    }

    function draw(timestamp) {
      if (!isPlaying) return;

      requestAnimationFrame(draw);

      if (timestamp - lastFrame < FRAME_INTERVAL) return;
      lastFrame = timestamp;

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      clearCanvas(width, height);

      if (!visualizerReady || !analyser || !dataArray) {
        drawIdleBars();
        return;
      }

      analyser.getByteFrequencyData(dataArray);

      const bars = window.innerWidth < 700 ? 18 : 28;
      const gap = 3;
      const barWidth = width / bars - gap;
      const step = Math.floor(dataArray.length / bars) || 1;

      for (let i = 0; i < bars; i++) {
        const value = dataArray[i * step] || 0;
        const barHeight = Math.max(6, (value / 255) * (height - 8));
        const x = i * (barWidth + gap);

        ctx.fillStyle = "#ff0000";
        ctx.fillRect(x, height - barHeight, barWidth, barHeight);

        ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
        ctx.fillRect(x, height - barHeight, barWidth, 3);
      }
    }

    resizeCanvas();
  </script>
</body>
</html>
