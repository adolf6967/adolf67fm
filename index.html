<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>67 FM</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #3a0000 0%, #120000 30%, #000000 70%),
        #000;
      color: #ff2d2d;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 0, 0, 0.06) 0px,
          rgba(255, 0, 0, 0.06) 2px,
          transparent 2px,
          transparent 4px
        );
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .gate-box,
    .player-box {
      width: 100%;
      max-width: 760px;
      background: rgba(10, 0, 0, 0.88);
      border: 4px solid #ff0000;
      box-shadow:
        0 0 10px #ff0000,
        0 0 30px rgba(255, 0, 0, 0.55),
        inset 0 0 40px rgba(255, 0, 0, 0.12);
      padding: 24px;
    }

    .logo {
      text-align: center;
      font-size: clamp(42px, 10vw, 96px);
      font-weight: 900;
      color: #ff0000;
      letter-spacing: 10px;
      text-transform: uppercase;
      text-shadow:
        0 0 6px #ff0000,
        0 0 14px #ff0000,
        3px 3px 0 #5c0000;
      margin-bottom: 16px;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from {
        opacity: 0.85;
        transform: scale(1);
      }
      to {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    .subline {
      text-align: center;
      font-size: 16px;
      color: #ff7272;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .gate-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 18px;
    }

    .gate-input {
      width: 100%;
      padding: 18px;
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      background: #130000;
      color: #ff2d2d;
      border: 3px solid #ff0000;
      outline: none;
      box-shadow: inset 0 0 12px rgba(255, 0, 0, 0.25);
    }

    .gate-input::placeholder {
      color: #8a2c2c;
    }

    .gate-btn,
    .main-btn {
      border: 3px solid #ff0000;
      background: linear-gradient(to bottom, #ff0000, #8c0000);
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      padding: 16px 18px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow:
        0 0 8px rgba(255, 0, 0, 0.7),
        inset 0 0 10px rgba(255, 255, 255, 0.15);
    }

    .gate-btn:hover,
    .main-btn:hover {
      filter: brightness(1.15);
      transform: scale(1.01);
    }

    .error {
      min-height: 28px;
      text-align: center;
      color: #ff6d6d;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .hidden {
      display: none !important;
    }

    .player-box {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .big-title {
      font-size: clamp(44px, 11vw, 100px);
      font-weight: 900;
      color: #ff0000;
      text-shadow:
        0 0 8px #ff0000,
        0 0 16px #ff0000,
        4px 4px 0 #490000;
      line-height: 1;
      text-align: center;
    }

    .canvas-wrap {
      width: 100%;
      border: 3px solid #ff0000;
      background: #050000;
      box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.18);
      padding: 10px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 220px;
      background:
        linear-gradient(to top, #160000, #050000);
    }

    .controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .main-btn {
      width: 100%;
      max-width: 320px;
      font-size: 34px;
      letter-spacing: 2px;
    }

    .vol-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .vol-label {
      font-size: 20px;
      font-weight: 900;
      color: #ff4d4d;
      text-shadow: 0 0 6px rgba(255, 0, 0, 0.7);
      letter-spacing: 3px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: #260000;
      border: 2px solid #ff0000;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      background: #ff0000;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(255,0,0,0.9);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      background: #ff0000;
      border: 2px solid #fff;
      box-shadow: 0 0 10px rgba(255,0,0,0.9);
      cursor: pointer;
    }

    .tiny {
      font-size: 12px;
      color: #933;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      .gate-box,
      .player-box {
        padding: 18px;
      }

      canvas {
        height: 160px;
      }

      .main-btn {
        font-size: 28px;
      }

      .gate-input {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <!-- Экран с паролем -->
  <div class="screen" id="gateScreen">
    <div class="gate-box">
      <div class="logo">67 FM</div>
      <div class="subline">доступ только для своих</div>

      <div class="gate-form">
        <input
          type="password"
          id="passwordInput"
          class="gate-input"
          placeholder="ПАРОЛЬ"
        />
        <button id="enterBtn" class="gate-btn">ВОЙТИ</button>
        <div class="error" id="errorBox"></div>
      </div>
    </div>
  </div>

  <!-- Экран плеера -->
  <div class="screen hidden" id="playerScreen">
    <div class="player-box">
      <div class="big-title">67 FM</div>

      <div class="canvas-wrap">
        <canvas id="visualizer"></canvas>
      </div>

      <div class="controls">
        <button id="playBtn" class="main-btn">PLAY</button>

        <div class="vol-wrap">
          <div class="vol-label">ГРОМКОСТЬ</div>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
        </div>
      </div>

      <div class="tiny">ЧЁРНО-КРАСНЫЙ КОЛХОЗНЫЙ ЭФИР</div>
    </div>
  </div>

  <audio id="radio" crossorigin="anonymous" preload="none">
    <source src="https://radio.67fm.ru/listen/radio67/radio.mp3" type="audio/mpeg" />
    Ваш браузер не поддерживает аудио.
  </audio>

  <script>
    // Не использую 1488.
    // Разрешённые пароли:
    const allowedPasswords = ["67", "radio67"];

    const gateScreen = document.getElementById("gateScreen");
    const playerScreen = document.getElementById("playerScreen");
    const passwordInput = document.getElementById("passwordInput");
    const enterBtn = document.getElementById("enterBtn");
    const errorBox = document.getElementById("errorBox");

    const radio = document.getElementById("radio");
    const playBtn = document.getElementById("playBtn");
    const volumeSlider = document.getElementById("volumeSlider");
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    let audioContext = null;
    let analyser = null;
    let source = null;
    let dataArray = null;
    let isPlaying = false;
    let visualizerStarted = false;

    function enterSite() {
      const val = passwordInput.value.trim();

      if (allowedPasswords.includes(val)) {
        errorBox.textContent = "";
        gateScreen.classList.add("hidden");
        playerScreen.classList.remove("hidden");
      } else {
        errorBox.textContent = "НЕВЕРНЫЙ ПАРОЛЬ";
      }
    }

    enterBtn.addEventListener("click", enterSite);
    passwordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") enterSite();
    });

    volumeSlider.addEventListener("input", () => {
      radio.volume = volumeSlider.value;
    });

    async function setupAudio() {
      if (visualizerStarted) return;

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;

      source = audioContext.createMediaElementSource(radio);
      source.connect(analyser);
      analyser.connect(audioContext.destination);

      const bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);

      visualizerStarted = true;
      resizeCanvas();
      draw();
    }

    async function togglePlay() {
      try {
        if (!visualizerStarted) {
          await setupAudio();
        }

        if (audioContext && audioContext.state === "suspended") {
          await audioContext.resume();
        }

        if (radio.paused) {
          await radio.play();
          isPlaying = true;
          playBtn.textContent = "PAUSE";
        } else {
          radio.pause();
          isPlaying = false;
          playBtn.textContent = "PLAY";
        }
      } catch (err) {
        console.error(err);
        alert("Не удалось запустить поток.");
      }
    }

    playBtn.addEventListener("click", togglePlay);

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);

    function draw() {
      requestAnimationFrame(draw);

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);

      // фон с грубыми полосами
      ctx.fillStyle = "#090000";
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < height; i += 20) {
        ctx.fillStyle = i % 40 === 0 ? "rgba(255,0,0,0.05)" : "rgba(255,0,0,0.02)";
        ctx.fillRect(0, i, width, 10);
      }

      if (!analyser || !dataArray) {
        drawFakeBars(width, height);
        return;
      }

      analyser.getByteFrequencyData(dataArray);

      const barCount = dataArray.length;
      const barWidth = Math.max(2, (width / barCount) - 2);
      let x = 0;

      for (let i = 0; i < barCount; i++) {
        const value = dataArray[i];
        const barHeight = (value / 255) * (height - 10);

        const red = 180 + Math.floor((value / 255) * 75);
        ctx.fillStyle = `rgb(${red}, 0, 0)`;
        ctx.fillRect(x, height - barHeight, barWidth, barHeight);

        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(255,0,0,0.7)";
        ctx.fillRect(x, height - barHeight, barWidth, barHeight);
        ctx.shadowBlur = 0;

        x += barWidth + 2;
      }
    }

    function drawFakeBars(width, height) {
      const bars = 48;
      const barWidth = width / bars - 2;
      let x = 0;

      for (let i = 0; i < bars; i++) {
        const t = Date.now() / 150 + i;
        const h = ((Math.sin(t) + 1) / 2) * (height * 0.75) + 10;
        ctx.fillStyle = "rgb(220,0,0)";
        ctx.fillRect(x, height - h, barWidth, h);
        x += barWidth + 2;
      }
    }
  </script>
</body>
</html>
